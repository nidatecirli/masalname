name: Build MASALNAME report PDF

on:
  push:
    branches: [main]
    paths:
      - 'MASALNAME-Vize-Raporu.tex'
      - 'weekly-submissions/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install XeLaTeX and report packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-european texlive-latex-extra

      - name: Build report PDF
        run: |
          xelatex -interaction=nonstopmode -halt-on-error MASALNAME-Vize-Raporu.tex
          xelatex -interaction=nonstopmode -halt-on-error MASALNAME-Vize-Raporu.tex
          cp MASALNAME-Vize-Raporu.pdf 86230005_NidaTecirlioglu_vize.pdf

      - name: Commit updated report PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MASALNAME-Vize-Raporu.pdf 86230005_NidaTecirlioglu_vize.pdf
          if git diff --cached --quiet; then
            echo "The report PDF is already up to date."
            exit 0
          fi
          git commit -m "Build updated MASALNAME report PDF"
          git push
