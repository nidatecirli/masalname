name: Publish MASALNAME to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const openTag = '<script>';
          const closeTag = '</script>';
          const start = html.indexOf(openTag);
          const end = html.indexOf(closeTag, start + openTag.length);
          if (start < 0 || end < 0) throw new Error('No inline JavaScript found.');
          fs.writeFileSync('/tmp/masalname-inline.js', html.slice(start + openTag.length, end));
          console.log('Extracted inline JavaScript for syntax validation.');
          NODE
          node --check /tmp/masalname-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
